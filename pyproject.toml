[project]
name = "claude-chat"
version = "0.1.0"
description = "A small command-line chatbot with conversation memory"
requires-python = ">=3.10"
dependencies = ["anthropic", "python-dotenv"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_chat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
